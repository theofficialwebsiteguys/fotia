@if (!verified()) {
  <div class="age-gate" role="dialog" aria-modal="true" aria-labelledby="age-gate-title" aria-describedby="age-gate-text">
    <div #panel class="age-gate__panel" tabindex="-1">
      <picture>
        <source type="image/webp" [attr.srcset]="logo.srcsetWebp" sizes="140px" />
        <img
          class="age-gate__logo"
          [src]="logo.src"
          [attr.srcset]="logo.srcsetPng"
          sizes="140px"
          [width]="logo.width"
          [height]="logo.height"
          alt="Fotia"
        />
      </picture>
      <span class="greek-key age-gate__rule" aria-hidden="true"></span>
      <p class="eyebrow">Age verification</p>
      <h2 id="age-gate-title" class="age-gate__title">Are you 21 or older?</h2>
      <p id="age-gate-text" class="age-gate__text">You must be 21 or older to enter this site.</p>
      <div class="age-gate__actions">
        <button type="button" class="btn btn--primary" (click)="confirm()">Yes, I’m 21 or older</button>
        <button type="button" class="btn" (click)="denied.set(true)">No</button>
      </div>
      <p class="age-gate__message" role="alert">
        @if (denied()) {
          Sorry, you must be 21 or older to visit Fotia.
        }
      </p>
    </div>
  </div>
}
